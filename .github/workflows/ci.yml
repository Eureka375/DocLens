name: DocLens integration regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13
      - name: Test non-GUI functionality
        run: uv run --locked python -m pytest -q --ignore=tests/test_desktop.py

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13
      - name: Test Windows Qt integration
        run: uv run --locked python -m pytest -q tests/test_desktop.py
