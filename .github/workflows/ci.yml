name: Regression and diff metrics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13
      - name: Run non-GUI regression suite
        run: uv run --locked python -m pytest -q --ignore=tests/test_desktop.py
      - name: Generate diff metrics
        if: always()
        run: uv run --locked python scripts/benchmark_diff.py --repeats 3 --output build/diff-metrics.json
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-metrics
          path: build/diff-metrics.json
          if-no-files-found: ignore

  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13
      - name: Test Windows desktop
        run: uv run --locked python -m pytest -q tests/test_desktop.py
