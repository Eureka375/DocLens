[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens"
version = "0.3.0"
description = "Document comparison, local folder search, and evidence-linked analysis for Windows"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "python-docx==1.2.0",
    "pypdf==7.1.1",
]

[project.gui-scripts]
doclens = "doclens.app:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.package-data]
doclens = ["ui/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
